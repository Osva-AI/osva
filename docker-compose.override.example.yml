# Copy to docker-compose.override.yml (gitignored) when host port 5432 is already in use.
# Prefer OSVA_POSTGRES_HOST_PORT=5433 in the shell or root .env when possible (no override file).
#
#   Copy-Item docker-compose.override.example.yml docker-compose.override.yml
#
# !override replaces the base ports list (Compose merge would otherwise publish 5432 and 5433).
# Set OSVA_DATABASE_URL / load-contributor-env.ps1 to the same host port.

services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"
