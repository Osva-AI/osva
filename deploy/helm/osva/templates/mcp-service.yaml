apiVersion: v1
kind: Service
metadata:
  name: {{ include "osva.fullname" . }}-mcp
  labels:
    app.kubernetes.io/name: {{ include "osva.name" . }}
    app.kubernetes.io/component: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "osva.name" . }}
    app.kubernetes.io/component: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
