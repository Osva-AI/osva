apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osva.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "osva.name" . }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "osva.name" . }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "osva.name" . }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "osva.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "osva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            {{- include "osva.workloadEnvFrom" . | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "osva.processProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "osva.artifactVolumeMount" . | nindent 12 }}
            - name: trusted-runtime
              mountPath: {{ .Values.trustedRuntimeRoot }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "osva.artifactVolume" . | nindent 8 }}
        - name: trusted-runtime
          emptyDir: {}
