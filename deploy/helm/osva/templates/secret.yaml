{{- if and (not .Values.existingSecret) (include "osva.usesSecretEnv" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osva.envSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "osva.name" . }}
    helm.sh/chart: {{ include "osva.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
