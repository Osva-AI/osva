apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osva.fullname" . }}-knowledge-worker
  labels:
    app.kubernetes.io/name: {{ include "osva.name" . }}
    app.kubernetes.io/component: knowledge-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.knowledgeWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "osva.name" . }}
      app.kubernetes.io/component: knowledge-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "osva.name" . }}
        app.kubernetes.io/component: knowledge-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "osva.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: knowledge-worker
          image: {{ include "osva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["knowledge-worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            {{- include "osva.workloadEnvFrom" . | nindent 12 }}
          {{- include "osva.containerEnvBlock" (dict "root" . "serviceName" "osva-knowledge-worker") | nindent 10 }}
          {{- include "osva.processProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.knowledgeWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "osva.artifactVolumeMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "osva.artifactVolume" . | nindent 8 }}
