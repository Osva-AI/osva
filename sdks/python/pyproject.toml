[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "osva-sdk"
version = "1.0.0"
description = "Official OSVA SDK for Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Osva-AI/osva"
Repository = "https://github.com/Osva-AI/osva"
Documentation = "https://github.com/Osva-AI/osva/blob/main/docs/OSS-1.0-QUICKSTART.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osva"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["osva"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
