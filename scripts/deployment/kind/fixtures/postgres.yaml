apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: osva-acceptance
type: Opaque
stringData:
  POSTGRES_PASSWORD: osva-acceptance
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: osva-acceptance
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: osva-acceptance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_DB
              value: osva
            - name: POSTGRES_USER
              value: osva
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "osva", "-d", "osva"]
            initialDelaySeconds: 5
            periodSeconds: 5
