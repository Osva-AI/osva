name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Integration tests (self-managed PostgreSQL)
        run: pnpm test:integration

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OSVA_DATABASE_URL: postgres://osva:osva@127.0.0.1:5432/osva
      OSVA_WEB_HOST: 127.0.0.1
      OSVA_WEB_PORT: 3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Docker Compose syntax
        run: docker compose config

      - name: Start local infrastructure
        run: pnpm infra:up

      - name: Assert PostgreSQL and Valkey health
        run: |
          docker compose exec -T postgres pg_isready -U osva -d osva
          docker compose exec -T valkey valkey-cli ping

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Smoke-test web and worker against Compose
        run: |
          set -euo pipefail

          WEB_LOG="$RUNNER_TEMP/osva-web.log"
          WORKER_LOG="$RUNNER_TEMP/osva-worker.log"
          WEB_PID_FILE="$RUNNER_TEMP/osva-web.pid"
          WORKER_PID_FILE="$RUNNER_TEMP/osva-worker.pid"

          dump_logs() {
            echo "::group::web log"
            cat "$WEB_LOG" 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::worker log"
            cat "$WORKER_LOG" 2>/dev/null || true
            echo "::endgroup::"
          }

          trap dump_logs ERR

          wait_http_200() {
            local url="$1"
            local attempts="${2:-30}"
            local i code=""
            for i in $(seq 1 "$attempts"); do
              if ! kill -0 "$WEB_PID" 2>/dev/null; then
                echo "web process exited before ${url} became reachable" >&2
                return 1
              fi
              code="$(curl -sS -o /dev/null -w "%{http_code}" "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "${url} -> 200"
                return 0
              fi
              sleep 1
            done
            echo "${url} did not return HTTP 200 within ${attempts}s (last=${code:-none})" >&2
            return 1
          }

          stop_gracefully() {
            local pid="$1"
            local name="$2"
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "${name} already exited"
              return 0
            fi
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
            local i
            for i in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" || true
                echo "${name} exited after SIGTERM"
                return 0
              fi
              sleep 1
            done
            echo "${name} did not exit after SIGTERM" >&2
            return 1
          }

          pnpm --filter @osva/web start >"$WEB_LOG" 2>&1 &
          WEB_PID=$!
          echo "$WEB_PID" > "$WEB_PID_FILE"

          wait_http_200 "http://127.0.0.1:3000/health" 30

          health_code="$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/health")"
          ready_code="$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/ready")"
          if [ "$health_code" != "200" ]; then
            echo "GET /health returned HTTP ${health_code}" >&2
            exit 1
          fi
          if [ "$ready_code" != "200" ]; then
            echo "GET /ready returned HTTP ${ready_code}" >&2
            exit 1
          fi

          pnpm --filter @osva/worker start >"$WORKER_LOG" 2>&1 &
          WORKER_PID=$!
          echo "$WORKER_PID" > "$WORKER_PID_FILE"

          worker_started=0
          for i in $(seq 1 15); do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "worker exited during idle smoke window" >&2
              exit 1
            fi
            if grep -q '"event":"worker.started"' "$WORKER_LOG"; then
              worker_started=1
              break
            fi
            sleep 1
          done
          if [ "$worker_started" -ne 1 ]; then
            echo "worker process was alive but did not log successful startup" >&2
            exit 1
          fi
          if ! kill -0 "$WORKER_PID" 2>/dev/null; then
            echo "worker exited after logging startup" >&2
            exit 1
          fi
          echo "worker remained alive after PostgreSQL readiness"

          stop_gracefully "$WORKER_PID" "worker"
          stop_gracefully "$WEB_PID" "web"

      - name: Stop web and worker processes
        if: always()
        run: |
          set -u
          stop_pidfile() {
            local file="$1"
            if [ ! -f "$file" ]; then
              return 0
            fi
            local pid
            pid="$(cat "$file")"
            if [ -z "$pid" ]; then
              return 0
            fi
            if kill -0 "$pid" 2>/dev/null; then
              pkill -TERM -P "$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
            fi
            local i
            for i in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            pkill -KILL -P "$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
          }
          stop_pidfile "$RUNNER_TEMP/osva-web.pid"
          stop_pidfile "$RUNNER_TEMP/osva-worker.pid"

      - name: Stop Compose infrastructure
        if: always()
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            pnpm infra:down
          else
            docker compose down
          fi
