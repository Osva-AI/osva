name: GitHub connector ToolGateway integration

on:
  pull_request:
    paths:
      - "packages/tool-gateway/**"
      - ".github/workflows/github-connector-integration.yml"
      - ".github/workflows/connector-tool-gateway-integration-reusable.yml"
  push:
    branches: [main]
    paths:
      - "packages/tool-gateway/**"
      - ".github/workflows/github-connector-integration.yml"
      - ".github/workflows/connector-tool-gateway-integration-reusable.yml"

permissions:
  contents: read

concurrency:
  group: github-connector-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-gateway-github-connector:
    uses: ./.github/workflows/connector-tool-gateway-integration-reusable.yml
    with:
      connector_id: github
      # Pin to the osva-connectors commit that contains C1.2 (stdio fixture + CI).
      # Update this SHA after connector fixture contract changes — do not use a floating branch ref.
      osva_connectors_ref: 4ce706e335422275a667faf15a26dba3485b2daf
      connector_npm_filter: "@osva-ai/connector-github"
      fixture_relative_path: packages/github/test/fixtures/.build/stdio-github-fixture.js
      require_env_var: OSVA_REQUIRE_GITHUB_CONNECTOR_INTEGRATION
      stdio_entry_env_var: OSVA_GITHUB_CONNECTOR_TEST_STDIO_ENTRY
      vitest_script: test:integration:github-connector
